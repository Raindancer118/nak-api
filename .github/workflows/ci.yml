name: ci

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install pdftotext (PDF extraction path)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: UI smoke test (demo mode in headless Chrome)
        run: |
          go build -o nak .
          scripts/ui-smoke.sh ./nak
      - name: Fixtures contain no personal data
        run: |
          # Fixtures are anonymised; fail if real-looking personal markers sneak in.
          ! grep -rIl -E '@(gmail|gmx|web|yahoo|outlook|hotmail)\.|DE[0-9]{20}' internal/*/testdata/

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/raindancer118/nak-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image for the smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: nak-api:ci
          build-args: VERSION=${{ github.ref_name }}
      - name: Smoke test (hardened like docker-compose.yml)
        run: |
          docker run -d --name nak -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true -e NAK_READONLY=1 nak-api:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nak)" = healthy ] && break; sleep 1
          done
          docker logs nak
          test "$(docker inspect -f '{{.State.Health.Status}}' nak)" = healthy
          tok=$(docker exec nak cat /data/web-token)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/tools)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $tok" localhost:8080/api/tools)" = 200
          test "$(docker exec nak id -u)" = 10001
          docker exec nak pdftotext -v
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main → :edge (what naknak.tstieh.de runs, pulled by the server itself),
      # tags → :X.Y.Z + :latest
      - name: Image tags
        id: tags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "list=$IMAGE:${GITHUB_REF_NAME},$IMAGE:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "list=$IMAGE:edge,$IMAGE:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Push multi-arch image
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Raindancer118/nak-api
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=WTFPL
          tags: ${{ steps.tags.outputs.list }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # run_number only grows, so every CI APK installs over the previous one
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then name="$GITHUB_REF_NAME"; else name="edge-${GITHUB_SHA::7}"; fi
          echo "NAKNAK_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "NAKNAK_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Release signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.NAKNAK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NAKNAK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAKNAK_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/naknak.jks"
          {
            echo "NAKNAK_KEYSTORE=$RUNNER_TEMP/naknak.jks"
            echo "NAKNAK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NAKNAK_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/naknak-$NAKNAK_VERSION_NAME.apk"
          (cd dist && sha256sum *.apk > naknak-apk-SHA256SUMS)
      - name: Check signature
        if: github.event_name == 'push'
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs dist/*.apk \
            | grep -q '4b886ba0e1a5e3859f857712bd40ec9bfe7fafd2660e4cb09f5db06cde50656e'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: naknak-apk
          path: android/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, image, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GROUP_PATH: de/raindancer118/nak-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: naknak-apk
          path: dist
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Raindancer118/nak-api/cmd.Version=$VERSION" \
              -o "dist/nak-api-$VERSION-$os-$arch$ext" .
          done
          (cd dist && sha256sum nak-api-* > SHA256SUMS)
      - name: GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Publish to packages.tstieh.de
        env:
          REPO_USER: ${{ secrets.REPOSILITE_USER }}
          REPO_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          base="https://packages.tstieh.de/releases/$GROUP_PATH/$VERSION"
          cat > "dist/nak-api-$VERSION.pom" <<POM
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>de.raindancer118</groupId>
            <artifactId>nak-api</artifactId>
            <version>$VERSION</version>
            <packaging>pom</packaging>
            <name>nak-api</name>
            <description>NORDAKADEMIE CIS + Moodle MCP server and CLI (Go binaries as classified artifacts: os-arch)</description>
            <url>https://github.com/Raindancer118/nak-api</url>
          </project>
          POM
          put() {
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' -u "$REPO_USER:$REPO_TOKEN" -X PUT --upload-file "$1" "$base/$2")
            case "$code" in
              200|201|204) echo "uploaded $2" ;;
              409) echo "::warning::$2 already exists (releases are immutable)" ;;
              *) echo "::error::upload $2 failed: HTTP $code $(cat /tmp/resp)"; exit 1 ;;
            esac
          }
          put "dist/nak-api-$VERSION.pom" "nak-api-$VERSION.pom"
          for f in dist/nak-api-$VERSION-*; do
            name=$(basename "$f")
            put "$f" "$name"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"; put "$f.sha1" "$name.sha1"
          done
          put dist/SHA256SUMS "nak-api-$VERSION-SHA256SUMS.txt"
